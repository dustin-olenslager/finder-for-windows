# Starter CI workflow — the ONE plane that binds every agent, in any tool.
#
# .agents/policy.md only fences the agent that reads it. This workflow is what actually blocks a bad merge
# from any agent — because it runs on the server, not on anyone's machine, and a required status check
# cannot be skipped with `--no-verify`.
#
# This is the kit repo's own workflow — uses POSIX sh scripts, no runtime deps.

name: verify
on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history, so the docs gate can diff against the PR base

      # Agent-mirror drift — fails if the AGENTS.md rules block is stale vs .agents/rules/*.md.
      # Tool-native generated mirrors are generated and gitignored; they are checked locally
      # when present, but never committed.
      - name: Agent mirrors in sync
        run: sh scripts/sync-agents.sh --check

      # The kit's canonical source is agent-agnostic: AGENTS.md + .agents/ + docs/agents/.
      # Tool-native mirrors are generated by sync-agents.sh and must never be committed.
      - name: No committed tool-native mirrors
        run: |
          # Paths git should be ignoring but that sometimes get committed accidentally.
          # Keep this list in sync with .gitignore's generated-mirror section.
          git ls-files | grep -E '^(\.claude/|\.cursor/|\.windsurf/|\.clinerules/|CLAUDE\.md|GEMINI\.md|CONVENTIONS\.md|\.github/copilot-instructions\.md)$' && {
            echo "Committed tool-native mirrors found. These are generated from AGENTS.md + .agents/rules/; remove them and add to .gitignore." >&2
            exit 1
          } || true

      # Docs landing gate — fails if any commit in this PR changed code but not the worklog.
      # Uses the PR base SHA (not a hardcoded branch name) so it works on any default branch and
      # on the first commit; the ref-guard in check-docs.sh fails loudly rather than silently passing.
      - name: Docs in sync
        run: sh scripts/check-docs.sh --since "${{ github.event.pull_request.base.sha }}"
        if: github.event_name == 'pull_request'

      # Conflict markers — the one corrupt state a generated file can be in that no other gate sees.
      # `sync-agents.sh --check` validates only its own block, so AGENTS.md reached main carrying
      # `<<<<<<< HEAD` and a doubled block with every gate green. Scans the tracked tree in one pass.
      - name: No unresolved conflict markers
        run: sh scripts/check-conflict-markers.sh

      # Expert-review gate — fails if non-trivial PR lacks review evidence:
      # plan.md exists, checklist.md has items, adr.md has new section, PR has ≥2 persona sign-offs.
      # Trivial escape: PR label "trivial", commit prefix "trivial:", or 1-file ≤15-line no-schema change.
      - name: Expert review
        run: sh scripts/check-expert-review.sh --since "${{ github.event.pull_request.base.sha }}"
        if: github.event_name == 'pull_request'

      # Launch gate — a change that marks a ship milestone complete must record a launch and a
      # rollback line (a sibling launch.md, or a '## Launch' section in the plan). Fills phase 6's
      # formerly-empty gate cell; presence only — it never guesses the deploy mechanism.
      - name: Launch record
        run: sh scripts/check-launch.sh --since "${{ github.event.pull_request.base.sha }}"
        if: github.event_name == 'pull_request'

      # Shell script lint — shellcheck if available. Scripts only: `.agents/commands/*.md` are
      # markdown, and linting prose as shell produced SC2148/SC1036/SC2215 noise on every run,
      # which is why this step had never once passed.
      # ESLint over the source. This is not a style gate — it is the check that catches a
      # reference to something that does not exist, which is how an undefined
      # `transferFiles` in the composition root reached a release candidate.
      - name: Lint (eslint)
        run: npx eslint src test scripts

      - name: Lint (shellcheck)
        run: |
          if command -v shellcheck >/dev/null 2>&1; then
            shellcheck scripts/*.sh
          else
            echo "shellcheck not installed, skipping"
          fi

      # Algorithm gate — fails a structural change whose plan carries no step-2 (deletion) artifact.
      # Requires the plan doc's "Deletion candidates" section; docs-only changes are exempt.
      - name: Algorithm pass
        run: sh scripts/check-algorithm.sh --since "${{ github.event.pull_request.base.sha }}"
        if: github.event_name == 'pull_request'

      # Spec gate — fails a structural change with no spec beside its plan, or a spec still carrying an
      # unresolved [NEEDS CLARIFICATION: …]. `check-spec.sh` ships in the kit, so a gate that silently
      # stops detecting is a kit defect: the self-test below proves it still detects, in CI.
      - name: Spec
        run: sh scripts/check-spec.sh --since "${{ github.event.pull_request.base.sha }}"
        if: github.event_name == 'pull_request'

      # Coverage gate — the spec→plan rivet. Fails when a requirement in a spec is claimed by no
      # milestone in its plan, or when a plan cites a requirement the spec never declared. Without this
      # the two rungs are sound individually and blind to each other, which is how a plan omits a third
      # of the requirements with every gate green.
      - name: Spec coverage
        run: sh scripts/check-coverage.sh --since "${{ github.event.pull_request.base.sha }}"
        if: github.event_name == 'pull_request'

      # Wireframe gate — a user-facing change needs a wireframe and its interviews before backend.
      # Presence only: it cannot judge whether the screen is good, which stays a review question.
      - name: Wireframe
        run: sh scripts/check-wireframe.sh --since "${{ github.event.pull_request.base.sha }}"
        if: github.event_name == 'pull_request'

      # Milestone evidence — a plan-to-code reconciliation: a COMPLETED milestone must name
      # resolvable evidence (a path that exists, or a PR that resolves). Grade only the
      # milestone lines this change wrote, so touching an old plan is not blocked by debt
      # that predates the rule.
      - name: Milestone evidence
        run: sh scripts/check-milestone-evidence.sh --since "${{ github.event.pull_request.base.sha }}"
        if: github.event_name == 'pull_request'

      # Architecture-boundary check — not applicable for shell-script kit (no boundary linter)
      # - name: Architecture boundaries
      #   run: <ARCH_CHECK_CMD>

      # Secret scan — a leaked credential fails the PR. Pinned, checksum-verified binary (no
      # org-license gate, unlike gitleaks/gitleaks-action). SHA-256 is the vendor-published digest
      # for this archive, verified against the release's own checksums.txt.
      - name: Secret scan
        env:
          GITLEAKS_VERSION: "8.28.0"
          GITLEAKS_SHA256: "a65b5253807a68ac0cafa4414031fd740aeb55f54fb7e55f386acb52e6a840eb"
        run: |
          set -euo pipefail
          asset="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$asset" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${asset}"
          echo "${GITLEAKS_SHA256}  ${asset}" | sha256sum -c -
          tar -xzf "$asset" gitleaks
          ./gitleaks detect --no-banner --redact --exit-code 1 \
            --log-opts="--no-merges ${{ github.event.pull_request.base.sha }}..HEAD"
        if: github.event_name == 'pull_request'

  # Gate self-tests live in their OWN job, gated on the kit's own tooling changing. The kit ships
  # gates adapted repos depend on, so a gate that silently stops detecting anything is a kit defect
  # and must be re-proven — but only when a gate or its fixtures could have changed. Running them on
  # every PR re-proves the kit's canaries on unrelated product PRs (in the shipped template that was
  # 4 of 11 steps), which is cost with no signal: a docs-only PR cannot tell anyone whether
  # check-spec.sh still detects. Push to main always runs them, so drift cannot hide behind the filter.
  self-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history, so the change detection can diff against the PR base

      # Decide whether the gates themselves changed. A step (not a job-level `if:`) because GitHub
      # has no native "paths changed since the PR base" condition; this is the smallest correct
      # mechanism and it keeps the required `verify` check identical for every PR.
      - name: Detect gate/tooling changes
        id: gate-changes
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --name-only "${{ github.event.pull_request.base.sha }}" HEAD \
               | grep -qE '^(scripts/|\.agents/rules/|\.github/workflows/)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "no gate/tooling change in this PR — skipping the kit's gate self-tests"
          fi

      # Proves the algorithm gate fails a missing-deletion-section change, passes a compliant one,
      # honors the docs-only exemption, and can be lifted by its own escape hatch. Without it, a gate
      # that blocks everything and a gate that detects correctly are indistinguishable.
      - name: Algorithm gate self-test
        if: steps.gate-changes.outputs.run == 'true'
        run: sh scripts/check-algorithm.test.sh

      # Proves the spec gate refuses a missing spec, refuses an unresolved marker, passes a compliant
      # one, honors the docs-only exemption, and can be lifted by SPEC_OFF.
      - name: Spec gate self-test
        if: steps.gate-changes.outputs.run == 'true'
        run: sh scripts/check-spec.test.sh

      # The coverage rivet's canary — proves it still refuses an uncovered requirement, both ways.
      - name: Coverage gate self-test
        if: steps.gate-changes.outputs.run == 'true'
        run: sh scripts/check-coverage.test.sh

      # The phase detector's canary — proves it still refuses a non-repo and still finds the
      # phase each fixture is in. Detection precedes every later rung, so it is proven in CI.
      - name: Factory phase detector self-test
        if: steps.gate-changes.outputs.run == 'true'
        run: sh scripts/factory-detect.test.sh

      # The wireframe gate's canary — proves it still refuses a user-facing change with no
      # wireframe, and still accepts a reasoned n/a.
      - name: Wireframe gate self-test
        if: steps.gate-changes.outputs.run == 'true'
        run: sh scripts/check-wireframe.test.sh

      # The milestone gate's canary — proves it still refuses a completed milestone with no
      # resolvable evidence, and still leaves an open milestone alone.
      - name: Milestone evidence gate self-test
        if: steps.gate-changes.outputs.run == 'true'
        run: sh scripts/check-milestone-evidence.test.sh

      # The context-budget canary — proves a generated mirror is an INDEX and not the inlined rule
      # corpus, that every rule module is named in it, and that conditional rules are not
      # force-loaded. These all regressed silently before anything measured them.
      - name: Doc-map / context-budget self-test
        if: steps.gate-changes.outputs.run == 'true'
        run: sh scripts/doc-map.test.sh

      # The plan-home gate was CI-wired with no canary of its own; this proves it refuses a stray
      # plan doc outside the doc spine, passes a plan in the spine, and honors PLAN_HOME_OFF.
      - name: Plan-home gate self-test
        if: steps.gate-changes.outputs.run == 'true'
        run: sh scripts/check-plan-home.test.sh

      # Proves the conflict-marker gate fails a marker, passes a clean tree, refuses a failed search,
      # and — case 6 — that sync-agents --check passes on the very file this gate rejects. If 6a ever
      # stops reproducing, the two checks have converged and this gate needs re-arguing.
      - name: Conflict-marker gate self-test
        if: steps.gate-changes.outputs.run == 'true'
        run: sh scripts/check-conflict-markers.test.sh

      # These two canaries existed, passed, and were wired into NO CI — so the two widest-blast-radius
      # gates (docs-landing and expert-review, both blocking on every PR) had canaries that could not
      # go red in CI. A canary nobody runs is not evidence.
      - name: Docs gate self-test
        if: steps.gate-changes.outputs.run == 'true'
        run: sh scripts/check-docs.test.sh

      - name: Expert-review gate self-test
        if: steps.gate-changes.outputs.run == 'true'
        run: sh scripts/check-expert-review.test.sh

      # Rule-fork drift self-test — proves check-rule-fork.sh refuses a fork that silently dropped a
      # policy rung, passes one that legitimately adapted, honors the allowlist, and exits 2 when its
      # own anchor list has rotted. It audits an EXTERNAL adopted repo, so it is not a per-PR gate
      # here; the self-test is what proves it still detects after a rule edit.
      - name: Rule-fork drift self-test
        if: steps.gate-changes.outputs.run == 'true'
        run: sh scripts/check-rule-fork.test.sh

      # The doctor decides whether a repo has adopted the kit, so a regression that makes it report
      # "current" for everything (or nothing) would silently stop every gate downstream.
      - name: Panoply doctor self-test
        if: steps.gate-changes.outputs.run == 'true'
        run: sh scripts/panoply.test.sh

      # The launch gate's canary — proves it still refuses a ship claim with no launch record and no
      # rollback line, passes one that carries both, and cannot go inert (mutation-tested).
      - name: Launch gate self-test
        if: steps.gate-changes.outputs.run == 'true'
        run: sh scripts/check-launch.test.sh
