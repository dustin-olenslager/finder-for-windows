<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self'; script-src 'self'; img-src 'self' data: file:; media-src file:; frame-src file:;">
  <title>Finder for Windows</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Drag strip. The native window controls sit in the overlay on the right
       (see titleBarOverlay in main.js), so this row is pure drag space. -->
  <div class="titlebar"></div>

  <!-- A real menu bar: every feature must be findable without knowing a shortcut. -->
  <nav class="menubar" id="menubar" aria-label="Menu">
    <button class="menubar-item" data-menu="file">File</button>
    <button class="menubar-item" data-menu="view">View</button>
    <button class="menubar-item" data-menu="go">Go</button>
    <button class="menubar-item" data-menu="help">Help</button>
  </nav>

  <header class="toolbar">
    <div class="toolbar-left">
      <button id="back" class="icon-btn" title="Back" aria-label="Back">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M10 2 4 8l6 6" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <button id="forward" class="icon-btn" title="Forward" aria-label="Forward">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M6 2l6 6-6 6" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <button id="up" class="icon-btn" title="Enclosing folder" aria-label="Enclosing folder">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 13.5V4M4 8l4-4 4 4" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </div>

    <div class="toolbar-title" id="folderTitle">Finder for Windows</div>

    <div class="toolbar-right">
      <!-- Sort and filter. Both are dropdowns because both are choices from a short
           known list, and a menu of dead ends is worse than no menu: the type list only
           offers kinds this folder actually contains. -->
      <div class="tool-btn-wrap">
        <button type="button" class="tool-btn" id="sortBtn" aria-haspopup="menu" aria-expanded="false" title="Sort the folder">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 3v10M4 13l-2.2-2.4M4 13l2.2-2.4M12 13V3M12 3 9.8 5.4M12 3l2.2 2.4" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <span id="sortLabel">Name</span>
        </button>
      </div>

      <div class="tool-btn-wrap">
        <button type="button" class="tool-btn" id="filterBtn" aria-haspopup="menu" aria-expanded="false" title="Show only some file types">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2.5 4h11M4.5 8h7M6.8 12h2.4" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
          <span id="filterLabel">Filter</span>
        </button>
      </div>

      <!-- Where a search looks. Finder has the same choice, and "everywhere" is the
           default because that is what a person means when they search. -->
      <label class="scope" id="scopeWrap" hidden>
        <select id="scope" aria-label="Where to search">
          <option value="everywhere">Everywhere</option>
          <option value="folder">This Folder</option>
        </select>
      </label>

      <div class="segmented" role="group" aria-label="View">
        <button class="seg is-active" data-view="column" title="as Columns" aria-label="Column view" aria-pressed="true">
          <svg viewBox="0 0 16 16" aria-hidden="true"><rect x="1.5" y="3" width="3.6" height="10" rx="1"/><rect x="6.2" y="3" width="3.6" height="10" rx="1"/><rect x="10.9" y="3" width="3.6" height="10" rx="1"/></svg>
        </button>
        <button class="seg" data-view="list" title="as List" aria-label="List view" aria-pressed="false">
          <svg viewBox="0 0 16 16" aria-hidden="true"><rect x="2" y="3" width="12" height="2.2" rx="1"/><rect x="2" y="6.9" width="12" height="2.2" rx="1"/><rect x="2" y="10.8" width="12" height="2.2" rx="1"/></svg>
        </button>
        <button class="seg" data-view="icon" title="as Icons" aria-label="Icon view" aria-pressed="false">
          <svg viewBox="0 0 16 16" aria-hidden="true"><rect x="2" y="2" width="5" height="5" rx="1.2"/><rect x="9" y="2" width="5" height="5" rx="1.2"/><rect x="2" y="9" width="5" height="5" rx="1.2"/><rect x="9" y="9" width="5" height="5" rx="1.2"/></svg>
        </button>
      </div>

      <label class="search">
        <svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="7" cy="7" r="4.2" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M10.4 10.4 14 14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
        <input id="search" type="search" placeholder="Search" autocomplete="off" spellcheck="false" aria-label="Search">
        <button type="button" class="search-clear" id="searchClear" title="Clear search" aria-label="Clear search" hidden>
          <svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6.4" fill="currentColor" opacity=".22"/><path d="M5.8 5.8l4.4 4.4M10.2 5.8l-4.4 4.4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
        </button>
      </label>

      <!-- Quick Look, as a visible control. The owner found this view by accidentally
           hitting the space bar, which is a discoverability failure rather than a missing
           feature — the command worked and nothing on screen said it existed. -->
      <button type="button" class="icon-btn" id="quicklookBtn" title="Quick Look (Space)" aria-label="Quick Look">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M1.6 8s2.4-4.4 6.4-4.4S14.4 8 14.4 8s-2.4 4.4-6.4 4.4S1.6 8 1.6 8Z" fill="none" stroke="currentColor" stroke-width="1.4"/><circle cx="8" cy="8" r="1.9" fill="none" stroke="currentColor" stroke-width="1.4"/></svg>
      </button>

      <!-- Visible toggle, so the preview is discoverable rather than a hidden shortcut. -->
      <button id="previewToggle" class="icon-btn is-on" title="Show preview" aria-label="Show preview" aria-pressed="true">
        <svg viewBox="0 0 16 16" aria-hidden="true"><rect x="1.6" y="3" width="12.8" height="10" rx="1.4" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M9.8 3v10" stroke="currentColor" stroke-width="1.4"/></svg>
      </button>

      <!-- Interface size. A visible control, not only a shortcut: the owner asked
           whether this was easy to do, and the answer must be yes without knowing a key. -->
      <div class="zoom">
        <button type="button" class="icon-btn" id="zoomOut" title="Smaller (Ctrl+-)" aria-label="Smaller">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 8h8" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
        </button>
        <span class="zoom-value" id="zoomValue">100%</span>
        <button type="button" class="icon-btn" id="zoomIn" title="Larger (Ctrl+=)" aria-label="Larger">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 4v8M4 8h8" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
        </button>
      </div>
    </div>
  </header>

  <!-- Search results replace the folder listing, exactly as they do in Finder. -->
  <div class="searchbar" id="searchbar" hidden>
    <span class="searchbar-label" id="searchSummary"></span>
    <span class="searchbar-spacer"></span>
    <button type="button" class="text-btn" id="searchExit">Back to Folder</button>
  </div>

  <!-- Index coverage. A search that silently knows only part of the disk is worse than
       no search, so the app always says what it has looked at. -->
  <div class="indexbar" id="indexbar" hidden>
    <span class="indexbar-text" id="indexText"></span>
    <span class="indexbar-spacer"></span>
    <button type="button" class="text-btn" id="indexAction"></button>
    <button type="button" class="text-btn subtle" id="indexDismiss">Dismiss</button>
  </div>

  <nav class="breadcrumb" id="breadcrumb" aria-label="Path"></nav>

  <!-- The name-pattern filter. Shown whenever a type filter is on, because the pattern
       is the thing that turns "9 items" into "3 takes" in a version folder. -->
  <div class="patternbar" id="patternBar" hidden>
    <span class="patternbar-label">Name contains</span>
    <input id="patternInput" type="search" placeholder="e.g. V003 or _VO" autocomplete="off" spellcheck="false" aria-label="Filter by name pattern">
    <button type="button" class="text-btn subtle" id="patternClear">Clear</button>
    <span class="patternbar-spacer"></span>
    <button type="button" class="text-btn subtle" id="filterClear">Show all types</button>
  </div>

  <!-- Says what is on the file clipboard, because a cut that looks like nothing is how
       people lose track of what is about to happen to their files. -->
  <div class="pastebar" id="pasteHint" hidden></div>

  <div class="body">
    <nav class="sidebar" id="sidebar" aria-label="Sidebar"></nav>
    <main class="content" id="content" aria-live="off">
      <p class="hint">Loading…</p>
    </main>
    <aside class="preview" id="preview" aria-label="Preview">
      <header class="preview-head">
        <div class="preview-titles">
          <span class="preview-name" id="previewName"></span>
          <span class="preview-meta" id="previewMeta"></span>
        </div>
        <div class="preview-steps" id="previewSteps" hidden>
          <button type="button" class="icon-btn step-btn" id="previewPrev" title="Previous item (←)" aria-label="Previous item">
            <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M10 3 5 8l5 5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <span class="media-count" id="mediaCount" aria-live="polite"></span>
          <button type="button" class="icon-btn step-btn" id="previewNext" title="Next item (→)" aria-label="Next item">
            <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M6 3l5 5-5 5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
        </div>
        <button type="button" class="icon-btn close-btn" id="previewClose" title="Hide preview" aria-label="Hide preview">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
        </button>
      </header>
      <div class="preview-body" id="previewBody"></div>
    </aside>
  </div>

  <footer class="statusbar">
    <span class="status-count" id="statusCount"></span>
    <span class="status-path" id="statusPath"></span>
  </footer>

  <!-- What the app SAYS, for anyone who cannot see it. Screen readers ignore a visually
       updated status bar: a count that changes from "12 items" to "0 items" is silent, and
       so is a toast that appears and disappears. This is the one region that gets spoken,
       and the app writes a short sentence here whenever the important state changes.
       Two regions, because an error has to interrupt (assertive) while a count must not. -->
  <div class="sr-only" id="announcer" role="status" aria-live="polite" aria-atomic="true"></div>
  <div class="sr-only" id="alerts" role="alert" aria-live="assertive" aria-atomic="true"></div>

  <!-- Quick Look: the spacebar overlay -->
  <div class="quicklook" id="quicklook" hidden>
    <div class="quicklook-card" role="dialog" aria-modal="true" aria-label="Quick Look">
      <header class="quicklook-head">
        <div class="preview-titles">
          <span class="preview-name" id="quicklookName"></span>
          <span class="preview-meta" id="quicklookMeta"></span>
        </div>
        <!-- The arrows describe a position among the files, so they appear only when the
             item on screen is one of several. The counter is the point: it says there is
             somewhere to go, which is what makes this view discoverable. -->
        <div class="preview-steps" id="quicklookSteps" hidden>
          <button type="button" class="icon-btn step-btn" id="quicklookPrev" title="Previous item (←)" aria-label="Previous item">
            <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M10 3 5 8l5 5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <span class="media-count" id="quicklookCount" aria-live="polite"></span>
          <button type="button" class="icon-btn step-btn" id="quicklookNext" title="Next item (→)" aria-label="Next item">
            <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M6 3l5 5-5 5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
        </div>
        <button type="button" class="icon-btn close-btn" id="quicklookClose" title="Close (Esc)" aria-label="Close Quick Look">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
        </button>
      </header>
      <div class="quicklook-body" id="quicklookBody"></div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
